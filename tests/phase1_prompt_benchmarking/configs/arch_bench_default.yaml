# Architecture Benchmark Configuration
# Tests LLM Analysis across all six prompt-delivery routes.

experiment_id: arch_bench_v1

paths:
  benchmark_inputs_dir: benchmark_inputs
  benchmark_clusters_csv: benchmark_inputs/benchmark_clusters.csv
  evidence_bundles_dir: benchmark_evidence_bundles
  output_dir: benchmarking_outputs/1.architecture_testing_outputs

model:
  provider: anthropic
  model_name: claude-sonnet-4-5
  temperature: 0.2
  max_tokens: 4000
  top_p: null
  top_k: null

run:
  num_replicates: 3
  dry_run: false
  workflow_testing: false
  overwrite_outputs: false
  continue_on_error: true
  save_prompts: true
  save_raw_outputs: true
  save_parsed_outputs: true
  save_traces: true

routes:
  include:
    - 3a
    - 3a_mcp
    - 3b
    - 3b_mcp
    - 3c
    - 3c_mcp

screens:
  include: all

clusters:
  include: all

mcp:
  preflight: true
  fail_if_unavailable: false

evaluation:
  structural: true
  logical_consistency: true
  efficiency: true
  robustness: true

timing:
  track_full_run: true
  track_prompt_construction: true
  track_model_latency: true
  track_metrics: true
  track_io: true
  track_step_latencies: true
  track_mcp_tool_latency: true
