# Integration test config — exercises run_benchmark dispatch for all three phases.
# Paths are overridden programmatically by the test harness (tmp_path).
# Uses denali / clusters 21 & 77.

experiment_id: integ_test

paths:
  benchmark_inputs_dir: OVERRIDE_ME
  benchmark_clusters_csv: OVERRIDE_ME
  evidence_bundles_dir: OVERRIDE_ME
  output_dir: OVERRIDE_ME

model:
  provider: anthropic
  model_name: claude-sonnet-4-5
  temperature: 0.0
  max_tokens: 1000

run:
  num_replicates: 1
  dry_run: true
  workflow_testing: true
  overwrite_outputs: true
  continue_on_error: false
  save_prompts: true
  save_raw_outputs: false
  save_parsed_outputs: false
  save_traces: true

architecture_benchmark:
  enabled: true
  base_routes:
    - single_call
    - cot
    - stepwise

order_benchmark:
  enabled: false
  base_routes:
    - single_call
  variants: O1-O2

wording_benchmark:
  enabled: false
  base_routes:
    - single_call
  targets: "W1"
  default_source: null
  force_source: null

screens:
  include:
    - denali

clusters:
  include: all

mcp:
  preflight: false
  fail_if_unavailable: false

evaluation:
  structural: true
  logical_consistency: false
  efficiency: false
  robustness: false

timing:
  track_full_run: true
  track_prompt_construction: false
  track_model_latency: false
  track_metrics: false
  track_io: false
  track_step_latencies: false
  track_mcp_tool_latency: false
