# Architecture Benchmark — Full Panel (Phase 1), Affinage evidence source
# 18 clusters (14 annotated + 4 negative-set) × 6 routes × 3 replicates = 324 runs.
# Affinage narratives (gated on audit_flag; UniProt backup). Negatives are run-only.

experiment_id: arch_bench_affinage_n3

paths:
  benchmark_inputs_dir: benchmark_inputs
  benchmark_clusters_csv: benchmark_inputs/benchmark_clusters.csv
  evidence_bundles_dir: benchmark_evidence_bundles_affinage
  output_dir: benchmarking_outputs/1.arch

model:
  provider: anthropic
  model_name: claude-sonnet-4-5
  temperature: 0.2
  max_tokens: 4000
  top_p: null
  top_k: null

run:
  num_replicates: 3
  max_workers: 4
  dry_run: false
  workflow_testing: false
  overwrite_outputs: true
  continue_on_error: true
  save_prompts: true
  save_raw_outputs: true
  save_parsed_outputs: true
  save_traces: true

architecture_benchmark:
  enabled: true
  base_routes:
    - single_call
    - single_call_mcp
    - cot
    - cot_mcp
    - stepwise
    - stepwise_mcp

screens:
  include: all

clusters:
  include: all

mcp:
  preflight: true
  fail_if_unavailable: false

evaluation:
  structural: true
  logical_consistency: true
  efficiency: true
  robustness: true

timing:
  track_full_run: true
  track_prompt_construction: true
  track_model_latency: true
  track_metrics: true
  track_io: true
  track_step_latencies: true
  track_mcp_tool_latency: true
