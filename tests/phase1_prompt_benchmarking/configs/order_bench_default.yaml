# Order Benchmark Configuration (Phase 2)
# Tests prompt-component order sensitivity across targeted perturbations.
# Extends the architecture benchmarking workflow with order-variant routes.

experiment_id: order_bench_v1

paths:
  benchmark_inputs_dir: benchmark_inputs
  benchmark_clusters_csv: benchmark_inputs/benchmark_clusters.csv
  evidence_bundles_dir: benchmark_evidence_bundles_uniprot
  output_dir: benchmarking_outputs/2.order

model:
  provider: anthropic
  model_name: claude-sonnet-4-5
  temperature: 0.2
  max_tokens: 4000
  top_p: null
  top_k: null

run:
  num_replicates: 1
  dry_run: false
  workflow_testing: false
  overwrite_outputs: false
  continue_on_error: true
  save_prompts: true
  save_raw_outputs: true
  save_parsed_outputs: true
  save_traces: true

# Order benchmarking (Phase 2)
# When enabled, routes are built from base_routes × variants below.
# The routes.include field is only used if order_benchmark.enabled = false.
order_benchmark:
  enabled: true
  base_routes:
    - 3b #adjust as needed
  variants:
    - canonical
    - late_screen_context
    - prioritization_before_classification
    - early_output_format
    - delayed_task_anchor

screens:
  include: all

clusters:
  include: all

mcp:
  preflight: true
  fail_if_unavailable: false

evaluation:
  structural: true
  logical_consistency: true
  efficiency: true
  robustness: true

timing:
  track_full_run: true
  track_prompt_construction: true
  track_model_latency: true
  track_metrics: true
  track_io: true
  track_step_latencies: true
  track_mcp_tool_latency: true
