experiment_id: wording_bench_v2_dry_test

paths:
  benchmark_inputs_dir: benchmark_inputs
  benchmark_clusters_csv: benchmark_inputs/benchmark_clusters.csv
  evidence_bundles_dir: benchmark_evidence_bundles_uniprot
  output_dir: benchmarking_outputs/3.wording

model:
  provider: anthropic
  model_name: claude-sonnet-4-5
  temperature: 0.2
  max_tokens: 4000

run:
  num_replicates: 1
  dry_run: true
  workflow_testing: true
  overwrite_outputs: true
  continue_on_error: true
  save_prompts: true
  save_raw_outputs: false
  save_parsed_outputs: false
  save_traces: true

wording_benchmark:
  enabled: true
  base_routes:
    - single_call
  # Selector options:
  #   targets: all
  #   targets: W1-W5
  #   targets: [W1, W3, W5]
  targets: all
  # Optional source resolution overrides:
  #   default_source: wording_v1 -> used by any target whose source is null
  #   force_source: wording_v2 -> overrides every selected target's own source
  default_source: null
  force_source: null

screens:
  include:
    - denali

clusters:
  include: all

mcp:
  preflight: false
  fail_if_unavailable: false

evaluation:
  structural: true
  logical_consistency: true
  efficiency: true
  robustness: true

timing:
  track_full_run: true
  track_prompt_construction: false
  track_model_latency: true
  track_metrics: false
  track_io: false
  track_step_latencies: false
  track_mcp_tool_latency: false
