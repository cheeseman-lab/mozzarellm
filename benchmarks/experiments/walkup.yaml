# The walkup experiment: build the prompt up from the blank W0 floor, one
# component per stage (CAT -> GCR -> NPR -> UPR -> PCC), on the evidence source
# the source experiment carried. Each stage runs 'prior' (the carried build)
# plus the candidates below and stops at the human gate; a person records the
# choice (candidate id or 'prior') under the walkup contract -- the stage's goal
# metric must improve beyond noise with the other panel metrics held.
#
# Candidate texts are the experiment's material and live here, with their
# rationales; engineered candidates (from miss censuses) are yaml edits with
# their rationale, committed and visible in history. Directions informed by the
# first flat run: GCR/NPR/PCC test validated ladders (simple -> +procedure ->
# +guard); CAT tests distinct task lenses plus the two engineered process-frame
# candidates; UPR candidates are all corrections (the v6 rules over-demoted
# named/annotated genes toward DARK_GENE).

experiment: walkup
description: build-up prompt walkup on the carried evidence source, human-gated per stage

uses: source.carry.source

model:
  provider: anthropic
  model_name: claude-sonnet-5
  # temperature omitted: claude-sonnet-5 rejects non-default sampling params
  max_tokens: 16000
  thinking: false

run:
  replicates: 3
  max_workers: 12
  route: single_call

stages:
  - component: CAT
    goal: category
    candidates:
      - id: concise
        rationale: >-
          lean task statement (multi-pathway-aware) -- tests whether the elaboration
          grounds the model or just spends tokens
        text: |
          MISSION: Analyze this gene cluster and:
          1. Identify the biological pathway(s) — a single dominant process, or 2-3 if the cluster genuinely
             spans several — that explain why these genes cluster together.
          2. Categorize ALL genes as ESTABLISHED (known role in the pathway), NOVEL_ROLE (characterized
             elsewhere), or UNCHARACTERIZED (no focused study).
          3. Prioritize NOVEL_ROLE and UNCHARACTERIZED genes for follow-up.

      - id: discovery_first
        rationale: >-
          lead with the recall-first mission + honest 'no coherent pathway' from the very
          first component (multi-pathway-aware)
        text: |
          MISSION: Functional genomics experiments cluster genes by phenotypic similarity. The deliverable is
          to surface UNDERSTUDIED genes (UNCHARACTERIZED and NOVEL_ROLE) that merit experimental follow-up.
          To do that:
          1. Identify the pathway(s) that best explain why these genes cluster — a single dominant process, or
             2-3 if the cluster genuinely spans several. This is the lens for discovery, not the end goal.
          2. Categorize ALL genes relative to that pathway (ESTABLISHED / NOVEL_ROLE / UNCHARACTERIZED).
          3. Prioritize the understudied genes for follow-up.

          If the genes do not share a coherent pathway, say so honestly rather than forcing a label — a clear
          "no coherent pathway" call is a valid and useful outcome.

      - id: pathway_anchored
        rationale: >-
          anchor on rigorously fixing the pathway(s) first, since every downstream call
          depends on it (multi-pathway-aware)
        text: |
          MISSION: Every downstream call depends on correctly identifying what unites this cluster, so anchor
          there first.
          1. Determine the biological pathway(s) that explain the cluster — commit to a single dominant
             process where one clearly fits, or 2-3 distinct processes if the cluster genuinely spans them. If
             no process explains a substantial share of the genes, declare no coherent pathway.
          2. Categorize ALL genes against that pathway (ESTABLISHED / NOVEL_ROLE / UNCHARACTERIZED).
          3. Prioritize UNCHARACTERIZED and NOVEL_ROLE genes for follow-up.

      - id: process_relative
        rationale: >-
          engineered from the W0 miss census (all 6 misses are NOVEL leaks): pin the
          categorization reference frame to the cluster's pathway -- a documented gene with
          no documented link to THIS pathway is NOVEL_ROLE not ESTABLISHED, a sparse gene
          whose evidence threads to the pathway is NOVEL_ROLE not UNCHARACTERIZED
        text: |
          MISSION: Functional genomics experiments cluster genes by phenotypic similarity. Your goal is to:
          1. Identify the dominant biological pathway(s) that explain why these genes cluster together — or
             declare no coherent pathway if none explains a substantial share of the genes.
          2. Categorize EVERY gene by its relationship to THAT pathway, never by how well the gene is
             characterized overall:
             - ESTABLISHED: the gene has a documented role in this cluster's pathway
             - NOVEL_ROLE: the gene is documented, but a role in this cluster's pathway is not — its
               membership here is the new evidence
             - UNCHARACTERIZED: annotation is too sparse to judge any relationship
             A well-studied gene with no documented link to this pathway is NOVEL_ROLE, not ESTABLISHED. A
             sparsely annotated gene whose evidence still threads to this pathway is NOVEL_ROLE, not
             UNCHARACTERIZED.
          3. Prioritize understudied genes (UNCHARACTERIZED and NOVEL_ROLE) for follow-up experiments.

          The pathway is not the end goal - it's the reference frame for deciding which genes merit
          investigation.

      - id: process_guarded
        rationale: >-
          round-2 engineering: process_relative fixed the fame leak (novel recall
          .857->.929) but over-rotated 5 in-pathway genes to NOVEL (SCD/SREBF2/GPAT4 in the
          lipid cluster); adds the symmetric guard -- check the annotation for the pathway
          itself before NOVEL_ROLE, and reserve UNCHARACTERIZED for annotation that offers
          nothing to relate
        text: |
          MISSION: Functional genomics experiments cluster genes by phenotypic similarity. Your goal is to:
          1. Identify the dominant biological pathway(s) that explain why these genes cluster together — or
             declare no coherent pathway if none explains a substantial share of the genes.
          2. Categorize EVERY gene by its relationship to THAT pathway, using this two-way test:
             - First check the gene's annotation FOR THE PATHWAY ITSELF: if its documented function is part
               of this cluster's pathway, it is ESTABLISHED — however famous or obscure the gene.
             - Only if its documented function is genuinely distinct from this pathway is it NOVEL_ROLE —
               membership here is the new evidence. General fame never makes a gene ESTABLISHED.
             - UNCHARACTERIZED is reserved for genes whose annotation offers nothing to relate; if any
               functional annotation exists, decide between ESTABLISHED and NOVEL_ROLE relative to the
               pathway.
          3. Prioritize understudied genes (UNCHARACTERIZED and NOVEL_ROLE) for follow-up experiments.

          The pathway is not the end goal - it's the reference frame for deciding which genes merit
          investigation.

  - component: GCR
    goal: category
    candidates:
      - id: decision_tree
        rationale: >-
          structure without direction: ordered gating fixes the procedure but is silent on
          which way to resolve sparse-but-relatable annotation or famous-but-pathway-irrelevant
          genes, so it matches the prior -- procedure alone is inert
        text: |
          PRECONDITION: This step applies ONLY when a coherent biological pathway has been identified for the cluster. If no coherent pathway exists, leave `established_genes`, `novel_role_genes`, and `uncharacterized_genes` empty and skip this step — per-gene classification relative to a nonexistent pathway is undefined.

          TASK: For each gene in the cluster, categorize as ESTABLISHED, NOVEL_ROLE, or UNCHARACTERIZED based on the evidence provided in the gene's bundle annotation.
          - ESTABLISHED: the annotation directly demonstrates the gene's role in the identified pathway.
          - NOVEL_ROLE: the annotation describes a documented function in a different pathway.
          - UNCHARACTERIZED: the annotation is empty, generic, or limited to homology/domain information.

          Gating procedure (apply in order):
          1. Does the bundle's annotation describe the gene's molecular function? → No → UNCHARACTERIZED.
          2. Does that annotation describe a role in THIS pathway? → Yes → ESTABLISHED.
          3. Otherwise → NOVEL_ROLE.

      - id: guarded
        rationale: >-
          one-way caution: decision_tree + blanket default-to-NOVEL-when-uncertain guards
          only against over-crediting, so asymmetric skepticism drains true ESTABLISHED
          calls (SREBF2/MARCHF6/HNRNPH1) -- caution without a counter-gate trades recall
          for nothing
        text: |
          PRECONDITION: This step applies ONLY when a coherent biological pathway has been identified for the cluster. If no coherent pathway exists, leave `established_genes`, `novel_role_genes`, and `uncharacterized_genes` empty and skip this step — per-gene classification relative to a nonexistent pathway is undefined.

          TASK: For each gene in the cluster, categorize as ESTABLISHED, NOVEL_ROLE, or UNCHARACTERIZED based on the evidence provided in the gene's bundle annotation.
          - ESTABLISHED: the annotation directly demonstrates the gene's role in the identified pathway.
          - NOVEL_ROLE: the annotation describes a documented function in a different pathway.
          - UNCHARACTERIZED: the annotation is empty, generic, or limited to homology/domain information.

          Gating procedure (apply in order):
          1. Does the bundle's annotation describe the gene's molecular function? → No → UNCHARACTERIZED.
          2. Does that annotation describe a role in THIS pathway? → Yes → ESTABLISHED.
          3. Otherwise → NOVEL_ROLE.

          When uncertain whether the bundle's evidence rises to the ESTABLISHED standard, default to NOVEL_ROLE — promoting on weak or indirect evidence misleads downstream follow-up.

      - id: two_way_guarded
        rationale: >-
          engineered from the round-1 GCR miss census: prior/simple/decision_tree make the
          identical 5 misses -- the thin-annotation trio WDR25/SNRNP27/ZMYM4 demoted
          NOV->UNC, plus PCYT1A/VKORC1L1 leaking NOV->EST on prominence -- while guarded's
          blanket default-to-NOVEL fixes the leaks but over-rotates SREBF2/MARCHF6/HNRNPH1
          (EST->NOV). Two scoped guards instead: UNCHARACTERIZED is reserved for annotation
          with nothing to relate (sparse-but-relatable is NOVEL_ROLE), and the ESTABLISHED
          test is pathway-relative with no default-to-NOVEL.
        text: |
          PRECONDITION: This step applies ONLY when a coherent biological pathway has been identified for the cluster. If no coherent pathway exists, leave `established_genes`, `novel_role_genes`, and `uncharacterized_genes` empty and skip this step — per-gene classification relative to a nonexistent pathway is undefined.

          TASK: For each gene in the cluster, categorize as ESTABLISHED, NOVEL_ROLE, or UNCHARACTERIZED based on the evidence provided in the gene's bundle annotation.
          - ESTABLISHED: the annotation documents a role in THIS cluster's pathway.
          - NOVEL_ROLE: the annotation documents function, but not in this pathway — its membership here is the new evidence.
          - UNCHARACTERIZED: the annotation offers nothing to relate to any process.

          Gating procedure (apply in order):
          1. Does the annotation offer ANY functional signal — a described function, a domain or motif, a process, an interaction? If NO (nothing to relate): UNCHARACTERIZED. A sparse annotation whose evidence still threads to some process is NOT uncharacterized — sparse but relatable means step 2 decides.
          2. Is the documented function part of THIS cluster's pathway? Yes: ESTABLISHED. No: NOVEL_ROLE. Judge against the pathway itself, not the gene's prominence — a well-studied gene with no documented role in this pathway is NOVEL_ROLE; general fame never makes a gene ESTABLISHED.

  - component: NPR
    goal: novel_subclass
    candidates:
      - id: simple
        rationale: flat NO/INDIRECT/PARTIAL/CONTRADICTORY definitions -- baseline
        text: |
          PRECONDITION: This step applies ONLY to genes already categorized as NOVEL_ROLE per the gene classification rules. If no genes were categorized as NOVEL_ROLE (because no coherent pathway exists, or no genes fit the criteria), do nothing — no sub-classification is needed.

          SUB-CLASSIFICATION (NOVEL_ROLE genes only): assign exactly one sub-class based on how the bundle's annotation relates to the identified pathway.
          - NO_EVIDENCE: nothing in the annotation links the gene to this pathway.
          - INDIRECT_EVIDENCE: the annotation shows a logical connection (shared organelle, upstream regulator) but no direct experimental link.
          - PARTIAL_EVIDENCE: the annotation hints at a link (proteomics hit, co-expression) without focused mechanistic study.
          - CONTRADICTORY_EVIDENCE: the annotation describes a function incompatible with this pathway.

      - id: data_gated_partial
        rationale: >-
          simple definitions + the one guard with a deterministic fix record (3/3 runs on
          the over-credit failure mode, vs 1/3 for blank): PARTIAL requires actual reported
          data -- a plausible connection without data is never PARTIAL. Constrains only the
          least-contested rung, leaving the noisy NO/INDIRECT boundary untouched, so it
          targets prior +1-2 with minimal see-saw risk. Loses only if the model compensates
          by inventing data mentions.
        text: |
          PRECONDITION: This step applies ONLY to genes already categorized as NOVEL_ROLE per the gene classification rules. If no genes were categorized as NOVEL_ROLE (because no coherent pathway exists, or no genes fit the criteria), do nothing — no sub-classification is needed.

          SUB-CLASSIFICATION (NOVEL_ROLE genes only): assign exactly one sub-class based on how the bundle's annotation relates to the identified pathway.
          - NO_EVIDENCE: nothing in the annotation links the gene to this pathway.
          - INDIRECT_EVIDENCE: the annotation shows a logical connection (shared organelle, upstream regulator) but no direct experimental link.
          - PARTIAL_EVIDENCE: the annotation reports actual data touching this pathway — a physical interaction, proteomics/co-IP hit, co-expression, or a functional assay — without focused mechanistic study.
          - CONTRADICTORY_EVIDENCE: the annotation describes a function incompatible with this pathway.

          PARTIAL_EVIDENCE always requires such reported data: a connection that is merely plausible, however strong the logic, is INDIRECT_EVIDENCE at most — never PARTIAL_EVIDENCE without data in the annotation.

      - id: articulation_floor
        rationale: >-
          pushes the NO/INDIRECT boundary UP; the clean successor to adjacency_check
          (retired for census-derived examples in its INDIRECT definition). The generic
          self-check principle only: a rationale that articulates any process-level
          relationship floors the gene at INDIRECT -- NO requires being unable to state
          one. PARTIAL still requires actual data; a generic compartment is not a
          relationship. Loses if the model rewrites its rationales to dodge the floor
          (the round-1 failure mode); wins if the unruled model articulates adjacency
          it then fails to credit.
        text: |
          PRECONDITION: This step applies ONLY to genes already categorized as NOVEL_ROLE per the gene classification rules. If no genes were categorized as NOVEL_ROLE (because no coherent pathway exists, or no genes fit the criteria), do nothing — no sub-classification is needed.

          SUB-CLASSIFICATION (NOVEL_ROLE genes only): assign exactly one sub-class based on how the bundle's annotation relates to the identified pathway.
          - NO_EVIDENCE: no process-level relationship between the gene's documented function and this pathway can be stated.
          - INDIRECT_EVIDENCE: a process-level relationship can be stated — shared machinery, an upstream or downstream step, the same macromolecular process — but the annotation reports no data touching the pathway itself.
          - PARTIAL_EVIDENCE: the annotation reports actual data touching this pathway — a physical interaction, proteomics/co-IP hit, co-expression, or a functional assay — but no focused mechanistic study.
          - CONTRADICTORY_EVIDENCE: the annotation describes a function incompatible with this pathway.

          Procedure (apply in order):
          1. Does the annotation describe a function incompatible with this pathway? → CONTRADICTORY_EVIDENCE.
          2. Does the annotation report experimental data touching this pathway (interaction, proteomics/co-IP, co-expression, functional assay)? → PARTIAL_EVIDENCE. PARTIAL always requires such data — a plausible connection WITHOUT data is never PARTIAL.
          3. Can a process-level relationship to the pathway be stated from the gene's documented function? → INDIRECT_EVIDENCE.
          4. Otherwise → NO_EVIDENCE.

          SELF-CHECK before finalizing any NO_EVIDENCE call: re-read the rationale you wrote for that gene. If it articulates ANY process-level relationship to the pathway — shared machinery, an upstream or downstream step, the same macromolecular process — the floor is INDIRECT_EVIDENCE; NO_EVIDENCE is correct only when no such relationship can be stated. Sharing a generic compartment (e.g. "nuclear", "cytoplasmic") is not a process-level relationship and stays NO_EVIDENCE.

  - component: UPR
    goal: unchar_subclass
    candidates:
      - id: name_respecting
        rationale: >-
          CORRECTED: a name+domain gene is ANNOTATED_ONLY, not DARK -- undoes the v6
          over-demotion that broke unchar-subclass
        text: |
          PRECONDITION: This step applies ONLY to genes already categorized as UNCHARACTERIZED per the gene
          classification rules. If no genes were categorized as UNCHARACTERIZED, do nothing.

          SUB-CLASSIFICATION (UNCHARACTERIZED genes only): assign exactly one sub-class from the gene's bundle
          annotation. A standard gene name plus domain/motif annotation IS meaningful signal — do NOT demote a
          named, domain-annotated gene to DARK_GENE merely because no mechanistic study exists.
          - DARK_GENE: no standard name AND no domain/functional annotation whatsoever.
          - NASCENT: no standard name, but the annotation contains preliminary functional data.
          - ANNOTATED_ONLY: has a standard name and/or domain/motif annotation but no mechanistic study — this
            is the default for named genes that lack a focused functional study.
          - NON_HUMAN_CHARACTERIZED: the annotation describes functional studies only in non-human organisms.

      - id: evidence_ladder
        rationale: >-
          CORRECTED: rank by the HIGHEST level of evidence actually present with no
          downward tiebreak (the v6 'prefer lower' guard was the likely source of the
          unchar-subclass loss)
        text: |
          PRECONDITION: This step applies ONLY to genes already categorized as UNCHARACTERIZED per the gene
          classification rules. If no genes were categorized as UNCHARACTERIZED, do nothing.

          SUB-CLASSIFICATION (UNCHARACTERIZED genes only): assign the sub-class matching the HIGHEST level of
          evidence present in the annotation. Evaluate in order and assign the first that matches; do not bias
          toward lower-information classes.
          - NON_HUMAN_CHARACTERIZED: functional studies described only in a non-human organism.
          - ANNOTATED_ONLY: a standard name with domain/motif annotation, no mechanistic study.
          - NASCENT: no standard name, but some preliminary functional data present.
          - DARK_GENE: none of the above — no name, no domain annotation, no functional data.

      - id: symbol_is_signal
        rationale: >-
          engineered from the round-1 census: all three text candidates demoted every
          empty-bundle gene to DARK -- including under name_respecting, which asserts the
          name-is-signal principle but never operationalizes what counts as named. The
          bundle DOES carry the distinguishing feature: an official gene symbol vs a raw
          identifier. This candidate makes identifier class the explicit test: an assigned
          symbol means the gene has been catalogued (ANNOTATED_ONLY even with no annotation
          text); DARK_GENE is reserved for raw-identifier-only genes. Generic bioinformatics
          distinction, no benchmark content.
        text: |
          PRECONDITION: This step applies ONLY to genes already categorized as UNCHARACTERIZED per the gene
          classification rules. If no genes were categorized as UNCHARACTERIZED, do nothing.

          SUB-CLASSIFICATION (UNCHARACTERIZED genes only): assign exactly one sub-class based on the gene's
          bundle annotation.
          - DARK_GENE: identified only by a raw identifier (e.g. an Ensembl ENSG or LOC-style ID) with no
            annotation of any kind.
          - NASCENT: no standard name, but some preliminary functional data exists.
          - ANNOTATED_ONLY: carries an official gene symbol and/or domain/motif annotation, but no
            functional study.
          - NON_HUMAN_CHARACTERIZED: functionally studied in a non-human organism only.

          Identifier test: a gene carrying an official gene symbol is NEVER DARK_GENE, even when its bundle
          contains no annotation text — an assigned symbol means the gene has been named and catalogued, and
          ANNOTATED_ONLY is the correct call. Reserve DARK_GENE for genes whose only identity is a raw
          database identifier.

  - component: PCC
    goal: coherence
    candidates:
      - id: counted_outsiders
        rationale: >-
          outsider_capped + arithmetic before adjectives (the move that worked at UPR):
          the cap engaged at c6-class clusters only 1-of-3 reps because "notable share"
          vs "a token few" is unquantified. Count explicitly and draw the line at more
          than one gene in ten unplaceable -> not High. Caveat on record: any threshold
          in 6-15% separates the benchmark's clusters identically, so the exact value is
          a stated convention (a reviewer's rule of thumb), not a fitted number, and
          cannot be validated at n=5.
        text: |
          PATHWAY CONFIDENCE: report how confident you are in your dominant_process call itself — an assessment of your own call, not merely of how well the genes fit it. First, count and state explicitly:
          - the total number of genes in the cluster;
          - the number the call places (ESTABLISHED or NOVEL_ROLE with a stated relationship);
          - the number of outsiders it cannot place — INCLUDING every UNCHARACTERIZED gene whose annotation offers nothing to relate to the pathway — and the outsider fraction.
          Then briefly consider the strongest alternative explanation for the cluster.

          High confidence:
          - The call would survive being wrong about any single gene; no credible alternative process; outsiders are at most one gene in ten. If MORE than one gene in ten is an outsider the call cannot be High, however well the placed genes fit.

          Medium confidence:
          - The call is the best available explanation, but it rests partly on inference (many members are not documented participants), more than one gene in ten is an outsider, or a plausible alternative process exists.

          Low confidence:
          - The call is tentative: an alternative explains the cluster about as well, or the cluster is heterogeneous enough that the dominant process may be an artifact of a subset.

          No coherent pathway (use Low confidence, set "dominant_process": "No coherent biological pathway", and leave `established_genes`, `novel_role_genes`, and `uncharacterized_genes` empty — per-gene classification relative to a nonexistent pathway is undefined):
          - No process explains a substantial share of the genes, or the cluster contains many unrelated functions or nontargeting controls.

      - id: outsider_capped
        rationale: >-
          call_confidence + explicit outsider accounting, from the reviewers' second stated
          input: genes the call cannot place -- including UNCHARACTERIZED genes whose
          annotation offers nothing to relate -- are outsiders, and a notable share of them
          caps confidence at Medium even when every placed gene fits. Targets the c6-class
          residual (high placed-gene purity, high unplaceable share) without touching the
          control (zero-outsider clusters unaffected).
        text: |
          PATHWAY CONFIDENCE: report how confident you are in your dominant_process call itself — an assessment of your own call, not merely of how well the genes fit it. Weigh three things:
          - how much of the cluster the pathway explains;
          - how many genes are outsiders the call cannot place — count them explicitly, INCLUDING every UNCHARACTERIZED gene whose annotation offers nothing to relate to the pathway;
          - whether a different biological process could explain the cluster comparably well. Before assigning a level, briefly consider the strongest alternative explanation.

          High confidence:
          - The call would survive being wrong about any single gene; outsiders are absent or a token few; no credible alternative process.

          Medium confidence:
          - The call is the best available explanation, but it rests partly on inference (many members are not documented participants), a notable share of the cluster is outsiders it cannot place, or a plausible alternative process exists. A notable outsider share caps confidence at Medium even when every placed gene fits perfectly.

          Low confidence:
          - The call is tentative: an alternative explains the cluster about as well, or the cluster is heterogeneous enough that the dominant process may be an artifact of a subset.

          No coherent pathway (use Low confidence, set "dominant_process": "No coherent biological pathway", and leave `established_genes`, `novel_role_genes`, and `uncharacterized_genes` empty — per-gene classification relative to a nonexistent pathway is undefined):
          - No process explains a substantial share of the genes, or the cluster contains many unrelated functions or nontargeting controls.

      - id: call_confidence
        rationale: >-
          engineered from reviewer testimony (all three reviewers, via Matteo): the label is
          "a level of confidence that comes with their call", predicated on purity and the
          presence of outsiders -- an epistemic self-assessment, not a cluster property.
          Round-2 evidence: composition can't be the axis (c6 refutes it at 72% EST) and
          hedging instructions never fire (guarded inert). This candidate names the axis
          and its three stated inputs: explained fraction, outsiders, and a credible-
          alternative margin test. Expected ceiling ~3/4: verbal self-confidence trends
          eric-mode regardless of wording; the consistency-based pipeline measure is the
          deeper alternative on record.
        text: |
          PATHWAY CONFIDENCE: report how confident you are in your dominant_process call itself — an assessment of your own call, not merely of how well the genes fit it. Weigh three things:
          - how much of the cluster the pathway explains;
          - how many genes are structurally unrelated outsiders with no place in the pathway;
          - whether a different biological process could explain the cluster comparably well. Before assigning a level, briefly consider the strongest alternative explanation.

          High confidence:
          - The call would survive being wrong about any single gene; few or no outsiders; no credible alternative process.

          Medium confidence:
          - The call is the best available explanation, but it rests partly on inference (many members are not documented participants), carries notable outsiders, or a plausible alternative process exists.

          Low confidence:
          - The call is tentative: an alternative explains the cluster about as well, or the cluster is heterogeneous enough that the dominant process may be an artifact of a subset.

          No coherent pathway (use Low confidence, set "dominant_process": "No coherent biological pathway", and leave `established_genes`, `novel_role_genes`, and `uncharacterized_genes` empty — per-gene classification relative to a nonexistent pathway is undefined):
          - No process explains a substantial share of the genes, or the cluster contains many unrelated functions or nontargeting controls.
